name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Verify tag matches package version
        run: |
          VERSION=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$VERSION" = "$GITHUB_REF_NAME"
      - name: Release gate
        run: |
          python -m pip install ".[dev]"
          python -m compileall -q src tests scripts
          PYTHONPATH=src:. python -m unittest discover -s tests -v
          PYTHONPATH=src:. python scripts/evaluate_planner.py
          python scripts/validate_distribution.py
          PYTHONPATH=. python scripts/sync_codex_plugin.py --check
          python scripts/security_scan.py
      - name: Build wheel
        run: |
          python -m pip wheel . --no-deps -w dist
          cd dist && sha256sum *.whl > SHA256SUMS
      - name: Attest wheel
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.whl
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
