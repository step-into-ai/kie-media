name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install ".[dev]"
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Unit tests
        run: PYTHONPATH=src:. python -m unittest discover -s tests -v
      - name: Offline planner evals
        run: PYTHONPATH=src:. python scripts/evaluate_planner.py
      - name: Validate agent distribution
        run: |
          python scripts/validate_distribution.py
          PYTHONPATH=. python scripts/sync_codex_plugin.py --check
      - name: Secret scan
        run: python scripts/security_scan.py
      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist
      - name: Inspect wheel
        run: python -m zipfile -l dist/kie_media-*.whl
