[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kie-media"
version = "0.3.0"
description = "Portable KIE.ai media agent with live models, safe image/video workflows, campaigns, and resumable execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]
license = {text = "MIT"}
authors = [{name = "Benjamin and Olymp"}]
keywords = ["kie-ai", "agent-skills", "image-generation", "video-generation", "claude-code", "codex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
dev = ["jsonschema>=4.19"]

[project.urls]
Homepage = "https://github.com/step-into-ai/kie-media"
Repository = "https://github.com/step-into-ai/kie-media.git"
Issues = "https://github.com/step-into-ai/kie-media/issues"
Changelog = "https://github.com/step-into-ai/kie-media/blob/main/CHANGELOG.md"
"KIE.ai API Access (referral)" = "https://kie.ai?ref=cf44220beef51bafae441080f5080412"

[project.scripts]
kie-media = "kie_media.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
